<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 600" width="400" height="600" role="img" aria-label="The Last Lighthouse poster">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0.4" y2="1"><stop offset="0" stop-color="#141e30"/><stop offset="1" stop-color="#243b55"/></linearGradient>
    <linearGradient id="fade" x1="0" y1="0" x2="0" y2="1"><stop offset="0.45" stop-color="#000" stop-opacity="0"/><stop offset="1" stop-color="#000" stop-opacity="0.85"/></linearGradient>
  </defs>
  <rect width="400" height="600" fill="url(#bg)"/>
  <polygon points="200,170 -40,60 -40,300" fill="#ffd36e" opacity="0.18"/><polygon points="200,170 440,60 440,300" fill="#ffd36e" opacity="0.12"/>
        <rect x="185" y="170" width="30" height="230" fill="#ffd36e" opacity="0.6"/><circle cx="200" cy="170" r="18" fill="#ffd36e"/>
